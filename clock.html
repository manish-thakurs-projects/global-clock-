<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Clock with Spotify</title>
    <style>
        :root {
            --red: #fbff00e8;
            --dark: #0a0a0a;
            --black: #000000;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: var(--black);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: sticky;
            top: 0;
        }
        .search-box {
            width: 100%;
            padding: 1rem;
            background: var(--dark);
            border: 1px solid var(--red);
            color: white;
            margin-bottom: 2rem;
            border-radius: 5px;
        }
        .clocks-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .clock-card {
            background: var(--dark);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--red);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .clock-card:hover {
            transform: translateY(-5px);
        }
        .timezone {
            color: var(--red);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .time {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .date {
            color: #666;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .modal.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 90%;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            display: none;
            border: none;
            color: var(--red);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-time {
            font-size: 7rem;
            margin: 2rem 0;
            color: var(--red);
        }
        .modal-date {
            font-size: 1.5rem;
            color: #888;
        }
        .spotify-player {
            margin-top: 6rem;
            width: 80vw;
            height: 80px;
            border-radius: 0;
            overflow: hidden;
         }
        .music-visual {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
            width: 60px;
            height: 60px;
            border: 2px solid var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
        }
        body {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

body::-webkit-scrollbar {
    display: none;     
}

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .clocks-container {
                grid-template-columns: 1fr;
            }
            .modal-time {
                font-size: 3rem;
            }
            .music-visual {
                width: 50px;
                height: 50px;
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" class="search-box" placeholder="Search timezone...">
        <div class="clocks-container"></div>
    </div>
    <div class="modal">
        <div class="modal-content">
            <button class="modal-close">✕</button>
            <div class="modal-timezone"></div>
            <div class="modal-time"></div>
            <div class="modal-date"></div>
            <div class="spotify-player">
                <iframe src="https://open.spotify.com/embed/playlist/3sJYo4FraKnU7ceSC12YyT" 
                        width="100%" 
                        height="80" 
                        frameborder="0" 
                        allowtransparency="true" 
                        allow="encrypted-media">
                </iframe>
            </div>
        </div>
    </div>


    <script>
        const clocksContainer = document.querySelector('.clocks-container');
        const searchBox = document.querySelector('.search-box');
        const modal = document.querySelector('.modal');
        const modalClose = document.querySelector('.modal-close');

        function getAllTimeZones() {
            return Intl.supportedValuesOf('timeZone');
        }

        function createClockCard(timeZone) {
            const card = document.createElement('div');
            card.className = 'clock-card';
            card.dataset.timezone = timeZone;
            card.innerHTML = `
                <div class="timezone">${timeZone.replace(/_/g, ' ')}</div>
                <div class="time"></div>
                <div class="date"></div>
            `;
            card.addEventListener('click', () => showModal(timeZone));
            return card;
        }

        function updateClock(card) {
            const tz = card.dataset.timezone;
            const options = {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const dateOptions = {
                timeZone: tz,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const time = new Date().toLocaleTimeString('en-US', options);
            const date = new Date().toLocaleDateString('en-US', dateOptions);
            card.querySelector('.time').textContent = time;
            card.querySelector('.date').textContent = date;
        }

        function showModal(timeZone) {
            modal.classList.add('show');
            updateModalTime(timeZone);
        }

        function updateModalTime(timeZone) {
            if (!modal.classList.contains('show')) return;
            const options = {
                timeZone: timeZone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const dateOptions = {
                timeZone: timeZone,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            const time = new Date().toLocaleTimeString('en-US', options);
            const date = new Date().toLocaleDateString('en-US', dateOptions);
            modal.querySelector('.modal-timezone').textContent = timeZone.replace(/_/g, ' ');
            modal.querySelector('.modal-time').textContent = time;
            modal.querySelector('.modal-date').textContent = date;
            setTimeout(() => updateModalTime(timeZone), 1000);
        }

        function init() {
            const timeZones = getAllTimeZones().slice(0, 50);
            timeZones.forEach(tz => clocksContainer.appendChild(createClockCard(tz)));
            setInterval(() => {
                clocksContainer.querySelectorAll('.clock-card').forEach(updateClock)
            }, 1000);
            searchBox.addEventListener('input', (e) => {
                const filtered = getAllTimeZones().filter(tz => 
                    tz.toLowerCase().includes(e.target.value.toLowerCase())
                );
                clocksContainer.innerHTML = '';
                filtered.slice(0, 50).forEach(tz => clocksContainer.appendChild(createClockCard(tz)));
            });
        }

        modalClose.addEventListener('click', () => modal.classList.remove('show'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('show');
        });

        init();
    </script>
</body>
</html>
